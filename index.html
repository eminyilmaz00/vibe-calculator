<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Scientific Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <!-- Header: Branding and title -->
    <header class="branding">
      <div class="dot"></div>
      <h1>Vibe Calculator</h1>
      <span class="mode">Dark</span>
    </header>

    <main class="app">
      <section class="calculator">
        <!-- Display Area: Shows current expression and result -->
        <div class="display">
          <div class="display-top">
            <span class="history-icon" aria-hidden="true">🕒</span>
            <span class="history-label">History</span>
          </div>
          <div id="expression" aria-live="polite"></div>
          <div id="result" aria-live="polite">0</div>
        </div>

        <!-- Keypad: 6-row, 4-column button grid -->
        <div class="buttons" role="grid">
          <button class="btn func" data-action="sin">sin</button>
          <button class="btn func" data-action="cos">cos</button>
          <button class="btn func" data-action="tan">tan</button>
          <button class="btn func" data-action="log">log</button>

          <button class="btn action" data-action="clear" aria-label="Clear">C</button>
          <button class="btn action" data-action="backspace" aria-label="Backspace">⌫</button>
          <button class="btn action" data-action="square">x²</button>
          <button class="btn op" data-value="/">÷</button>

          <button class="btn num" data-value="7">7</button>
          <button class="btn num" data-value="8">8</button>
          <button class="btn num" data-value="9">9</button>
          <button class="btn op" data-value="*">×</button>

          <button class="btn num" data-value="4">4</button>
          <button class="btn num" data-value="5">5</button>
          <button class="btn num" data-value="6">6</button>
          <button class="btn op" data-value="-">−</button>

          <button class="btn num" data-value="1">1</button>
          <button class="btn num" data-value="2">2</button>
          <button class="btn num" data-value="3">3</button>
          <button class="btn op" data-value="+">+</button>

          <button class="btn func" data-action="sqrt">√</button>
          <button class="btn num zero" data-value="0">0</button>
          <button class="btn num" data-value=".">.</button>
          <button class="btn action equal" data-action="equals" aria-label="Calculate">=</button>
        </div>
      </section>

      <!-- History Sidebar: Shows last 10 calculations -->
      <aside class="history">
        <div class="history-header">
          <h3>History</h3>
          <button id="clearHistory" class="mini-btn" aria-label="Clear history">Clear</button>
        </div>
        <ul id="historyList"></ul>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
